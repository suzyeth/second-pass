<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1200" viewBox="0 0 680 600">
<rect width="680" height="600" fill="#0d1117"/>
<style>
.t{font:14px "Segoe UI",sans-serif;fill:#e6edf3}
.ts{font:12px "Segoe UI",sans-serif;fill:#9aa7b2}
.th{font:500 14px "Segoe UI",sans-serif;fill:#e6edf3}
.hd{font:500 13px "Segoe UI",sans-serif;fill:#7d8590}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<text class="hd" x="40" y="34">Second Pass — attention and content, and four checks a dashboard does not run</text>
<rect x="40" y="50" width="185" height="78" rx="4" fill="#132033" stroke="#2b4468" stroke-width="0.5"/><text class="th" x="132" y="76" text-anchor="middle">Ingest</text><text class="ts" x="132" y="98" text-anchor="middle">yt-dlp · most-replayed</text><text class="ts" x="132" y="118" text-anchor="middle">Blender films, CC-BY</text><rect x="247" y="50" width="185" height="78" rx="4" fill="#0f2b2b" stroke="#245a58" stroke-width="0.5"/><text class="th" x="339" y="76" text-anchor="middle">Prepare</text><text class="ts" x="339" y="98" text-anchor="middle">find the end credits</text><text class="ts" x="339" y="118" text-anchor="middle">truncate, then detrend</text><rect x="454" y="50" width="186" height="78" rx="4" fill="#132033" stroke="#2b4468" stroke-width="0.5"/><text class="th" x="547" y="76" text-anchor="middle">Score</text><text class="ts" x="547" y="98" text-anchor="middle">Gemini, 360p + audio</text><text class="ts" x="547" y="118" text-anchor="middle">blind to the curve</text><line x1="225" y1="89" x2="245" y2="89" stroke="#7d8590" stroke-width="1.5" marker-end="url(#a)"/><line x1="432" y1="89" x2="452" y2="89" stroke="#7d8590" stroke-width="1.5" marker-end="url(#a)"/><path d="M547 128 V150 H340 V172" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="174" width="600" height="92" rx="4" fill="#1d1730" stroke="#3d2f63" stroke-width="0.5"/><text class="th" x="340" y="200" text-anchor="middle">ClickHouse Cloud</text><text class="ts" x="340" y="222" text-anchor="middle">segments · 300 rows, 198 usable after credits and edges</text><text class="ts" x="340" y="242" text-anchor="middle">playback_events · 13.3M, synthetic and labelled so</text><text class="ts" x="340" y="262" text-anchor="middle">craft_videos · 73 real demo videos, a second corpus</text><line x1="340" y1="266" x2="340" y2="292" stroke="#7d8590" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="294" width="600" height="86" rx="4" fill="#2b2312" stroke="#5c4a1e" stroke-width="0.5"/><text class="th" x="340" y="320" text-anchor="middle">Four checks, all of them queries</text><text class="ts" x="340" y="342" text-anchor="middle">detrend before claiming · correct for multiplicity</text><text class="ts" x="340" y="362" text-anchor="middle">fixed negative control on a toggle · test whether it replicates</text><line x1="340" y1="380" x2="340" y2="406" stroke="#7d8590" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="408" width="185" height="86" rx="4" fill="#0f2b2b" stroke="#245a58" stroke-width="0.5"/><text class="th" x="132" y="434" text-anchor="middle">Google ADK agent</text><text class="ts" x="132" y="456" text-anchor="middle">picks 1 of 7 questions</text><text class="ts" x="132" y="476" text-anchor="middle">never writes SQL</text><rect x="247" y="408" width="185" height="86" rx="4" fill="#0f2b2b" stroke="#245a58" stroke-width="0.5"/><text class="th" x="339" y="434" text-anchor="middle">mcp-clickhouse</text><text class="ts" x="339" y="456" text-anchor="middle">official MCP server</text><text class="ts" x="339" y="476" text-anchor="middle">on the runtime path</text><rect x="454" y="408" width="186" height="86" rx="4" fill="#0f2b2b" stroke="#245a58" stroke-width="0.5"/><text class="th" x="547" y="434" text-anchor="middle">Cloud Run</text><text class="ts" x="547" y="456" text-anchor="middle">FastAPI, SSE</text><text class="ts" x="547" y="476" text-anchor="middle">player, chart, proof</text><line x1="225" y1="451" x2="245" y2="451" stroke="#7d8590" stroke-width="1.5" marker-end="url(#a)"/><line x1="432" y1="451" x2="452" y2="451" stroke="#7d8590" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="512" width="600" height="56" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.5"/><text class="th" x="340" y="538" text-anchor="middle">Every judgement is a column, not a sentence</text><text class="ts" x="340" y="560" text-anchor="middle">both noise floors, the verdict, the position-artifact flag and the sign test come back as SQL</text></svg>