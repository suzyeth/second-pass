name: Reproduce analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python analyze.py
      - run: python analyze-credits.py
      - run: python analyze-beats.py
      - run: python analyze-film.py tos
      - run: python analyze-film.py bbb
      - run: python analyze-film.py sintel
